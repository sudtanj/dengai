name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        id: fmt
        continue-on-error: true
        run: cargo fmt --all --check || { cargo fmt --all && git diff > fmt.patch; exit 1; }
      - name: Lockfile
        id: lock
        continue-on-error: true
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff --exit-code Cargo.lock > /dev/null || { git diff Cargo.lock > lock.patch; exit 1; }
      - name: Upload rustfmt / lockfile patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patches
          path: |
            fmt.patch
            lock.patch
          if-no-files-found: ignore
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Fail on format or lockfile drift
        if: steps.fmt.outcome == 'failure' || steps.lock.outcome == 'failure'
        run: exit 1

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl   # Orange Pi Zero 3
          - target: x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Binary size
        run: |
          ls -l target/${{ matrix.target }}/release/dengai
          file target/${{ matrix.target }}/release/dengai
          echo "${{ matrix.target }}: $(stat -c %s target/${{ matrix.target }}/release/dengai) bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dengai dist/
          cp README.md LICENSE LICENSE-APACHE LICENSE-POLYFORM-NONCOMMERCIAL.md NOTICE dist/
          tar -C dist -czf dengai-${{ matrix.target }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dengai-${{ matrix.target }}
          path: dengai-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dengai-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
